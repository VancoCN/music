name: Build Playlist

on:
  push:
    paths:
      - '**.mp3'
      - '**.m4a'
      - '**.flac'
      - '**.ogg'
      - '**.wav'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 playlist.json
        run: |
          python3 -c "
          import os, json
          exts = ('.mp3', '.m4a', '.flac', '.ogg', '.wav')
          skip = {'.git', '.github'}
          files = []
          for root, dirs, fs in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in skip]
              for f in fs:
                  if f.lower().endswith(exts):
                      files.append(os.path.relpath(os.path.join(root, f), '.').replace(os.sep, '/'))
          files.sort()
          json.dump(files, open('playlist.json', 'w'), ensure_ascii=False, indent=2)
          print('共', len(files), '首')
          "

      - name: 提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --cached --quiet || git commit -m "chore: update playlist [skip ci]"
          git push
